name: Discover version branches

on:
  workflow_call:
    outputs:
      branches:
        description: >-
          JSON array of branch objects ({branch, safe, java, java_distribution,
          gradle_task, gradle_args}) resolved from .github/branches.json
        value: ${{ jobs.discover.outputs.branches }}

permissions:
  contents: read

jobs:
  discover:
    name: Resolve branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve branch list from branches.json
        id: list
        run: |
          set -euo pipefail
          git ls-remote --heads origin | sed 's#.*refs/heads/##' > refs.txt
          python3 .github/scripts/modci.py branches \
            --config .github/branches.json \
            --refs refs.txt

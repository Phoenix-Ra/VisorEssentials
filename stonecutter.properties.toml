# ---- Mod --------------------------------------------------------------------------------------
mod_id = "visor_essentials"
mod_name = "VisorEssentials"
mod_group = "org.vmstudio"
mod_authors = "PhoenixRa"
mod_description = "Visor Addon, that is aimed to enhance the VR experience"
mod_license = "LGPL-3.0-only"

# ---- Visor ------------------------------------------------------------------------------------
# (AtumVR and AtumConfiguration included).
# "local" = <root>/libs, "maven" = Modrinth Maven (maven.modrinth:visor:<visor_version>+mc<mc>-<loader>:api)
visor_source  = "maven"
visor_version = "0.6.0-alpha.1"
visor_version_range_fabric    = ">=0.6.0-alpha.1"
visor_version_range_forgelike = "[0.6.0-alpha.1,)"

# ---- Common dependencies ----------------------------------------------------------------------
fabric_loader_version = "0.16.14"
fabric_loader_version_range = ">=0.14.14"
# Compatibility level of the mixin configs: JAVA_<level>
mixin_compat_level    = 17
mixin_extras_version  = "0.4.1"
lombok_version        = "1.18.46"
jetbrains_annotations_version = "26.1.0"

# ---- Version Targets --------------------------------------------------------------------------
[targets]
"1.20.1" = ["fabric", "forge"]
"1.20.2" = ["fabric", "forge", "neoforge"]
"1.20.4" = ["fabric", "forge", "neoforge"]
"1.20.6" = ["fabric", "forge", "neoforge"]
"1.21.1" = ["fabric", "forge", "neoforge"]

# ---- Version dependencies ---------------------------------------------------------------------
["1.20.1"]
# 1.20 - 1.20.1
java_version = 17
pack_format = 15
minecraft_version_range_fabric = ">=1.20 <1.20.2"
minecraft_version_range_forgelike = "[1.20,1.20.1]"
parchment_version = "2023.09.03"
fabric_api_version = "0.92.3"
forge_version = "47.4.0"
forge_version_range = "[46,)"

["1.20.2"]
# 1.20.2
java_version = 17
pack_format = 18
minecraft_version_range_fabric = ">=1.20.2 <1.20.3"
minecraft_version_range_forgelike = "[1.20.2]"
parchment_version = "2023.12.10"
fabric_api_version = "0.91.6"
forge_version = "48.1.0"
forge_version_range = "[48,)"
neoforge_version = "20.2.93"
neoforge_version_range = "[20.2,)"

["1.20.4"]
# 1.20.3 - 1.20.4
java_version = 17
pack_format = 22
minecraft_version_range_fabric = ">=1.20.3 <1.20.5"
minecraft_version_range_forgelike = "[1.20.3,1.20.4]"

forge_version = "49.2.9"
forge_version_range = "[49,)"
neoforge_version = "20.4.251"
neoforge_version_range = "[20.4,)"

["1.20.6"]
# 1.20.5 - 1.20.6
java_version = 21
pack_format = 32
minecraft_version_range_fabric = ">=1.20.5 <1.21"
minecraft_version_range_forgelike = "[1.20.5,1.20.6]"
